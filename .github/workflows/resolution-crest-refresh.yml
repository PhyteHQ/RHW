name: Build approved Resolution crest

on:
  push:
    branches: [resolution-crest-refresh]
    paths:
      - 'scripts/refresh_resolution_crest.py'
      - '.github/workflows/resolution-crest-refresh.yml'

permissions:
  contents: write

jobs:
  prepare-crest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install PNG processing dependency
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Generate the approved branding assets
        run: |
          python3 scripts/refresh_resolution_crest.py
          python3 scripts/build_app_assets.py
          python3 scripts/build_app_assets.py --check
          python3 scripts/validate_dashboard.py
          node scripts/test_app_contracts.js
          python3 scripts/test_build_assets.py
      - name: Commit generated assets to the review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/rhw-crest.png assets/rhw-forum-logo.png assets/favicon.png assets/apple-touch-icon.png assets/pwa-icon-192.png assets/pwa-icon-512.png assets/pwa-icon-maskable-512.png assets/build-assets.json js/core/config.js js/build-info.js js/rhw-workspaces.js index.html sw.js scripts/smoke_interface_foundation.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh Resolution crest and PWA icons"
          git push origin HEAD:refs/heads/resolution-crest-refresh

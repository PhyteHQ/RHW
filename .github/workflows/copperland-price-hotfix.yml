name: Copperland Price Hotfix

on:
  push:
    branches: [fix/copperland-buy-from-base]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/copperland-buy-from-base

      - name: Fix Copperland price direction
        shell: python
        run: |
          from pathlib import Path

          p = Path('js/37-app-price-check.js')
          s = p.read_text(encoding='utf-8')

          old = "      const pobLivePrice = finite(good?.sell_price ?? good?.price_to_buy_from_base ?? good?.buy_price);"
          new = "      // PoB shop semantics: price = player buys from base; sell_price = base buys from player.\n      const pobLivePrice = finite(good?.price ?? good?.price_to_buy_from_base ?? good?.buy_price);"
          if old not in s and new not in s:
              raise SystemExit('Copperland POB price expression not found')
          s = s.replace(old, new)

          old_test = "    if (finite(pobGoodFor({ shop_items: [{ name: 'Copper', sell_price: 80 }] }, 'Copper')?.sell_price) !== 80) failures.push('copper-pob-price');"
          new_test = "    if (finite(pobGoodFor({ shop_items: [{ name: 'Copper', price: 100, sell_price: 80 }] }, 'Copper')?.price) !== 100) failures.push('copper-pob-buy-from-base-price');"
          if old_test not in s and new_test not in s:
              raise SystemExit('Copperland POB self-test not found')
          s = s.replace(old_test, new_test)

          p.write_text(s, encoding='utf-8')

      - name: Validate JavaScript
        run: node --check js/37-app-price-check.js

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Hotfix already applied.'
            exit 0
          fi
          git config user.name 'RHW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add js/37-app-price-check.js
          git commit -m 'Fix Copperland buy-from-base price direction'
          git push origin HEAD:fix/copperland-buy-from-base

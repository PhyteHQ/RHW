name: RHW Pages Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Concurrency belongs to the whole workflow, not only the deploy job. A newer
# push to the same ref cancels the older validation/deploy run immediately, so
# an older deploy can never race in later and cancel the newest release.
concurrency:
  group: rhw-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify generated app assets
        run: python3 scripts/build_app_assets.py --check

      - name: Validate dashboard structure
        run: python3 scripts/validate_dashboard.py

      - name: Validate Discovery sync engine
        run: python3 scripts/test_discovery_sync.py

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find js -name '*.js'); do
            echo "Checking ${file}"
            node --check "${file}"
          done

      - name: Validate retired-data archive compatibility
        run: node scripts/test_legacy_archive.js

      - name: Validate Transfer Center model
        run: node scripts/test_transfer_center.js

      - name: Validate build, route and lifecycle contracts
        run: |
          python3 scripts/test_build_assets.py
          node scripts/test_app_contracts.js

      - name: Validate audit regressions
        run: node scripts/test_audit_regressions.js

      - name: Validate Price Check provenance and backup
        run: node scripts/test_price_check.js

      - name: Validate shipyard recipes and inventory
        run: node scripts/test_shipyard.js

      - name: Validate Logistics market scans
        run: node scripts/test_logistics_scans.js

      - name: Validate Full App Audit model
        run: node scripts/test_full_audit.js

      - name: Install smoke-test client
        run: python3 -m pip install --disable-pip-version-check --quiet websocket-client==1.8.0

      - name: Runtime smoke test
        run: python3 scripts/smoke_v40.py

      - name: Background and render lifecycle
        if: ${{ !cancelled() }}
        run: node scripts/test_runtime_lifecycle.js

      - name: Bundled interface, fonts and offline reload
        if: always()
        run: |
          python3 scripts/build_app_assets.py --check --dist
          RHW_SMOKE_SITE=dist python3 scripts/smoke_interface_foundation.py

      - name: Save interface checks and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhw-interface-review
          path: artifacts/interface
          if-no-files-found: ignore

      - name: Mobile Logistics discoverability smoke test
        if: ${{ !cancelled() }}
        run: python3 scripts/smoke_stability_polish.py

      - name: Compact COMMAND hierarchy smoke test
        if: ${{ !cancelled() }}
        run: python3 scripts/smoke_command_compact.py

      - name: Focused daily-navigation smoke test
        if: ${{ !cancelled() }}
        run: python3 scripts/smoke_focus_pass.py

      - name: Recipe correctness smoke test
        if: ${{ !cancelled() }}
        run: python3 scripts/smoke_v40_recipes.py

      - name: Final recipe label, costing and header smoke test
        if: ${{ !cancelled() }}
        run: python3 scripts/smoke_v40_final_polish.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Package runtime files only
        run: python3 scripts/build_app_assets.py --check --dist

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

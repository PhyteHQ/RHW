name: Inspect full live navigation response
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Capture full current map and reproduce failure
        run: |
          python3 - <<'PY'
          import json,urllib.request,gzip,collections,pathlib,datetime
          req=urllib.request.Request('https://darkstat.dd84ai.com/api/systems',data=b'{}',headers={'Content-Type':'application/json','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=65) as response:
              data=json.load(response)
          out=pathlib.Path('artifacts/navigation');out.mkdir(parents=True,exist_ok=True)
          with gzip.open(out/'systems-full.json.gz','wt') as f:json.dump(data,f)
          report={'receivedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'systems':len(data),'duplicateGroups':[],'invalid':[]}
          for system in data:
              for key in ['Objs','Jumpholes']:
                  groups=collections.defaultdict(list)
                  for obj in system.get(key) or []:groups[obj.get('Nickname')].append(obj)
                  for nick,rows in groups.items():
                      if len(rows)>1:
                          simplified=[{k:x.get(k) for k in ['Nickname','Kind','GotoSystem','Pos']} for x in rows]
                          report['duplicateGroups'].append({'system':system.get('nickname'),'collection':key,'nickname':nick,'rows':simplified})
          (out/'audit.json').write_text(json.dumps(report,indent=2))
          print('SYSTEMS',report['systems'],'DUPLICATE GROUPS',len(report['duplicateGroups']))
          print(json.dumps(report['duplicateGroups'][:20],indent=2))
          PY
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {gunzipSync} from 'node:zlib';
          import {currentNavigation} from './js/supply/live-navigation.mjs';
          const map=JSON.parse(gunzipSync(fs.readFileSync('assets/navigation.json.gz')));
          const systems=JSON.parse(gunzipSync(fs.readFileSync('artifacts/navigation/systems-full.json.gz')));
          try {const live=currentNavigation(map,systems,new Date().toISOString());console.log('FULL FEED ACCEPTED',live.nodes.length,live.links.length)}
          catch(error){console.log('REPRODUCED CURRENT FAILURE:',error.message)}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-full-response
          path: artifacts/navigation

name: Inspect public route freshness feeds
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read current public POB and map feeds
        run: |
          python3 - <<'PY'
          import json,urllib.request
          for endpoint in ['pobs','systems']:
              req=urllib.request.Request('https://darkstat.dd84ai.com/api/'+endpoint,data=b'{}',headers={'Content-Type':'application/json','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=55) as response:
                  raw=response.read()
              data=json.loads(raw)
              print(endpoint,'bytes',len(raw),'rows',len(data))
              assert isinstance(data,list) and data
              if endpoint=='pobs':
                  for row in data:
                      if row.get('nickname')=='gifu_station':
                          print('GIFU',{k:row.get(k) for k in ['money','defense_mode','is_fallback_info','system_nickname']})
                          print('PROPULSION',[{k:x.get(k) for k in ['nickname','quantity','min_stock','max_stock','price']} for x in row.get('shop_items',[]) if x.get('nickname')=='commodity_ship_part_propulsion'])
              else:
                  print('SYSTEM KEYS',list(data[0]))
                  for row in data:
                      if row.get('nickname') in ['iw06','ku02','br01']:
                          print('SYSTEM',row.get('nickname'),'JUMPS',row.get('Jumpholes'),'OBJECT SAMPLES',(row.get('Objs') or [])[:3])
          PY

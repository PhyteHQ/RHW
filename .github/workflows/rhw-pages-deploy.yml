name: Gallic purchase inspection
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public ship and ID data
        run: |
          python3 - <<'PY'
          import urllib.request,json,re
          api='https://darkstat.dd84ai.com/api/'
          wanted=['dsy_super_gallic_train','dsy_gallic_train_adv','dsy_advanced_train']
          def post(path,body):
            req=urllib.request.Request(api+path,data=json.dumps(body).encode(),headers={'Content-Type':'application/json','Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=40) as r:return json.load(r)
          ships=post('ships',{'include_market_goods':True,'include_tech_compat':True,'filter_nicknames':wanted})
          for s in ships:
            if s.get('nickname') not in wanted:continue
            keys=['nickname','name','class','type','hold_size','cruise_speed','dock_type','price','ship_packages','market_goods']
            data={k:s.get(k) for k in keys}
            data['spa_tech']=s.get('tech_compat',{}).get('techchompat_by_id',{}).get('dsy_license_co_os_grp')
            print('PUBLIC_SHIP '+json.dumps(data,ensure_ascii=False))
          names=['dsy_license_co_os_grp','dsy_super_gallic_train']
          cards=post('infocards',names)
          for name,card in zip(names,cards):
            lines=[''.join(p.get('phrase','') for p in row.get('phrases',[])) for row in card.get('infocard',[])][:180]
            print('PUBLIC_CARD '+json.dumps({'nickname':name,'lines':lines},ensure_ascii=False))
          try:
            url='https://disco-api.dd84ai.com/gameconfigpublic/base_recipe_items.cfg'
            text=urllib.request.urlopen(url,timeout=25).read().decode('utf8','replace')
            matches=[s for s in re.split(r'(?=\[recipe\])',text,flags=re.I) if 'super_gallic_train' in s.lower()]
            print('PUBLIC_RECIPE '+json.dumps({'url':url,'bytes':len(text),'matches':matches},ensure_ascii=False))
          except Exception as e:print('PUBLIC_RECIPE_ERROR '+str(e))
          PY

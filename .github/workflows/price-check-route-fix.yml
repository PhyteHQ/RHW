name: Price Check Route Cleanup

on:
  push:
    branches: [fix/price-check-routes]

permissions:
  contents: read

jobs:
  copper-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Inspect Darkstat Coronado and Copper sellers
        shell: python
        run: |
          import json, urllib.request
          url = 'https://darkstat.dd84ai.com/api/npc_bases'
          body = json.dumps({
              'include_market_goods': True,
              'filter_to_useful': False,
              'filter_market_good_category': ['commodity']
          }).encode()
          req = urllib.request.Request(url, data=body, headers={'Accept':'application/json','Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              bases = json.load(response)

          def norm(value): return ' '.join(str(value or '').lower().split())
          print(f'BASE_COUNT={len(bases)}')

          candidates = []
          for base in bases:
              name = norm(base.get('name'))
              system = norm(base.get('system_name'))
              goods = base.get('market_goods') or []
              copper = [g for g in goods if norm(g.get('name')) == 'copper' or norm(g.get('nickname')) in {'copper','commodity_copper'}]
              if 'copper' in name or 'coronado' in system or copper:
                  candidates.append((base, copper))

          print(f'CANDIDATES={len(candidates)}')
          for base, copper in candidates:
              print('BASE', json.dumps({k:base.get(k) for k in ('name','nickname','system_name','system_nickname')}, ensure_ascii=False))
              for good in copper:
                  print('COPPER', json.dumps({k:good.get(k) for k in ('name','nickname','base_sells','price_base_sells_for','price_base_buys_for','is_server_override')}, ensure_ascii=False))

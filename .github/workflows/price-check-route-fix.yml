name: Price Check Route Cleanup

on:
  push:
    branches: [fix/price-check-routes]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/price-check-routes
      - name: Apply Price Check fix
        run: python3 scripts/apply_price_check_route_fix.py
      - name: Validate JavaScript
        run: node --check js/37-app-price-check.js
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'RHW Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add js/37-app-price-check.js
          git commit -m 'Use Copperland POB sell price in Price Check'
          git push origin HEAD:fix/price-check-routes

name: Price Check Route Cleanup

on:
  push:
    branches: [fix/price-check-routes]

permissions:
  contents: read

jobs:
  copper-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Inspect Darkstat Copperland POB
        shell: python
        run: |
          import json, urllib.request

          def norm(value): return ' '.join(str(value or '').lower().split())
          url = 'https://darkstat.dd84ai.com/api/pobs'
          req = urllib.request.Request(url, data=b'', headers={'Accept':'application/json'}, method='POST')
          with urllib.request.urlopen(req, timeout=30) as response:
              bases = json.load(response)

          print(f'POB_COUNT={len(bases)}')
          matches = [b for b in bases if 'copperland' in norm(b.get('name')) or 'copperland' in norm(b.get('nickname'))]
          print(f'COPPERLAND_MATCHES={len(matches)}')
          for base in matches:
              print('POB', json.dumps({k:base.get(k) for k in ('name','nickname','system_name','system','owner') if k in base}, ensure_ascii=False))
              goods = base.get('shop_items') or []
              copper = [g for g in goods if norm(g.get('name') or g.get('item_name') or g.get('nickname')) in {'copper','commodity_copper'}]
              print(f'COPPER_ITEMS={len(copper)}')
              for good in copper:
                  print('COPPER', json.dumps(good, ensure_ascii=False, sort_keys=True))

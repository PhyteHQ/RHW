name: Build system time and tools update

on:
  push:
    branches: [system-time-tools]
    paths:
      - '.github/workflows/system-time-tools-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Build and verify runtime assets
        run: |
          python3 scripts/build_app_assets.py
          python3 scripts/build_app_assets.py --check
          python3 scripts/validate_dashboard.py
          node --check js/forum/composer.js
          node --check js/core/pwa.js
          python3 -m py_compile scripts/smoke_interface_foundation.py scripts/smoke_workflows.py
          node scripts/test_app_contracts.js
          node scripts/test_runtime_lifecycle.js
          node scripts/test_transfer_center.js
          node scripts/test_audit_regressions.js
          python3 scripts/test_build_assets.py
      - name: Commit generated runtime assets to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/build-assets.json js/build-info.js js/rhw-dashboard.js js/rhw-workspaces.js index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild system date and app status runtime assets"
          git push origin HEAD:refs/heads/system-time-tools

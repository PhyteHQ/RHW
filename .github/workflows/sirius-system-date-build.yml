name: Build Sirius system date

on:
  push:
    branches: [sirius-system-date]
    paths:
      - '.github/workflows/sirius-system-date-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Build and verify runtime assets
        run: |
          python3 scripts/build_app_assets.py
          python3 scripts/build_app_assets.py --check
          python3 scripts/validate_dashboard.py
          node --check js/forum/composer.js
          python3 -m py_compile scripts/smoke_interface_foundation.py
          node scripts/test_app_contracts.js
          node scripts/test_transfer_center.js
          python3 scripts/test_build_assets.py
      - name: Commit generated runtime assets to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/build-assets.json js/build-info.js js/rhw-workspaces.js index.html sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild Sirius date runtime assets"
          git push origin HEAD:refs/heads/sirius-system-date
